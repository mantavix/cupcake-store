app = "seu-nome-app"  # substitua pelo nome do seu app

[build]
  builder = "paketobuildpacks/builder:base"

[[services]]
  internal_port = 80
  protocol = "tcp"
  
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
  
  [[services.ports]]
    port = 80
  
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  
  [[services.tcp_checks]]
    interval = 10000
    timeout = 2000
